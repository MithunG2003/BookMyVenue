{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <img src="{% static 'images/logo1.png' %}" width="90" class="mb-3">

        <h2 class="fw-bold text-primary">
            Venue Owner Dashboard
        </h2>

        <p class="text-muted">
            Manage your venues, booking requests and profile from one place.
        </p>

    </div>

    <!-- First Row -->
    <div class="row justify-content-center g-4">

        <!-- Add Venue -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-primary">
                        ➕
                    </div>

                    <h5 class="mt-3">Add Venue</h5>

                    <a href="{% url 'add_venue' %}"
                       class="btn btn-primary mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

        <!-- My Venues -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-success">
                        🏢
                    </div>

                    <h5 class="mt-3">My Venues</h5>

                    <a href="{% url 'owner_venues' %}"
                       class="btn btn-success mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

        <!-- Booking Requests -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-warning">
                        🔔
                    </div>

                    <h5 class="mt-3">Booking Requests</h5>

                    <a href="{% url 'booking_requests' %}"
                       class="btn btn-warning mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

        <!-- Bookings -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-info">
                        📅
                    </div>

                    <h5 class="mt-3">Bookings</h5>

                    <a href="{% url 'owner_bookings' %}"
                       class="btn btn-info mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

    </div>

    <!-- Second Row -->
    <div class="row justify-content-center g-4 mt-3">

        <!-- Profile -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-secondary">
                        👤
                    </div>

                    <h5 class="mt-3">Profile</h5>

                    <a href="{% url 'profile' %}"
                       class="btn btn-secondary mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

        <!-- Cancellation Requests -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card dashboard-card shadow border-0 h-100">
                <div class="card-body text-center">

                    <div class="icon-circle bg-danger">
                        ❌
                    </div>

                    <h5 class="mt-3">Cancellation Requests</h5>

                    <a href="{% url 'cancellation_requests' %}"
                       class="btn btn-danger mt-3 w-100">
                        Open
                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

<style>

.dashboard-card{
    border-radius:20px;
    transition:0.4s;
}

.dashboard-card:hover{
    transform:translateY(-10px);
    box-shadow:0 18px 35px rgba(0,0,0,.25)!important;
}

.icon-circle{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:34px;
}

.btn{
    border-radius:30px;
    font-weight:bold;
}

</style>

{% endblock %}
