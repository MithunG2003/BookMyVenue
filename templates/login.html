{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>

body{
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("{% static 'images/JP1.avif' %}") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Poppins', sans-serif;
}

.login-section{
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    color:white;
    animation:fadeIn .8s ease;
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.login-title{
    font-weight:700;
    font-size:30px;
}

.login-subtitle{
    color:#f1f1f1;
}

.form-label{
    font-weight:600;
}

.input-group-text{
    background:white;
    border:none;
}

.form-control{
    border:none;
    height:52px;
}

.form-control:focus{
    box-shadow:0 0 10px rgba(13,110,253,.4);
}

.input-group{
    border-radius:12px;
    overflow:hidden;
}

.btn-login{
    background:linear-gradient(45deg,#0d6efd,#6610f2);
    border:none;
    height:52px;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    transition:.3s;
}

.btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(13,110,253,.4);
}

.text-link{
    color:white;
    text-decoration:none;
    transition:.3s;
}

.text-link:hover{
    color:#FFD43B;
}

.alert{
    border-radius:12px;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

<div class="container login-section">

<div class="login-card p-4">

<div class="text-center mb-4">

<img src="{% static 'images/logo.png' %}" class="logo">

<h2 class="login-title mt-3">
Welcome Back
</h2>

<p class="login-subtitle">
Sign in to Book My Venue
</p>

</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" autocomplete="off">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Username
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<button
type="button"
class="btn btn-light"
onclick="togglePassword()">

<i class="bi bi-eye-fill" id="eyeIcon"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
id="remember">

<label
class="form-check-label"
for="remember">

Remember Me

</label>

</div>

<a href="{% url 'forgot_password' %}" class="text-link">

Forgot Password?

</a>

</div>

<button
type="submit"
class="btn btn-login w-100">

<i class="bi bi-box-arrow-in-right"></i>

&nbsp; Login

</button>

</form>

<hr class="border-light my-4">

<div class="text-center">

Don't have an account?

<a href="{% url 'register' %}" class="text-link fw-bold">

Register Here

</a>

</div>

</div>

</div>

<script>

function togglePassword(){

var password=document.getElementById("password");
var eye=document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";

eye.classList.remove("bi-eye-fill");
eye.classList.add("bi-eye-slash-fill");

}
else{

password.type="password";

eye.classList.remove("bi-eye-slash-fill");
eye.classList.add("bi-eye-fill");

}

}

</script>

{% endblock %}
