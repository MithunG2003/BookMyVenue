{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h3>Notifications</h3>

    {% for n in notes %}
    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <h5>{{ n.title }}</h5>
            <p>{{ n.message }}</p>
            <small class="text-muted">{{ n.created_at }}</small>

            {% if "approved" in n.title|lower %}
            <div class="mt-2">
                <a href="{% url 'my_bookings' %}" class="btn btn-success">
                    Proceed to Payment
                </a>
            </div>
            {% endif %}
        </div>
    </div>
    {% empty %}
    <div class="alert alert-info">
        No notifications available.
    </div>
    {% endfor %}

</div>

{% endblock %}
