{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Owner Profile</h3>
        </div>

        <div class="card-body">

            <table class="table">

                <tr>
                    <th>Username</th>
                    <td>{{ request.user.username }}</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>{{ request.user.email }}</td>
                </tr>

            </table>

            <a href="{% url 'owner_dashboard' %}" class="btn btn-primary">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

{% endblock %}
